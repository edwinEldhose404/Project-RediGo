<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reddit News Summarizer (Black & Darker Yellow)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Space Mono for techy feel -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Space Mono', monospace; /* Techy font */
            background-color: #000000; /* Black background */
            color: #ffffff; /* White text */
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Align to top */
            min-height: 100vh;
            padding: 2rem;
            overflow-y: auto; /* Allow scrolling for content */
        }
        .container {
            background-color: #1a1a1a; /* Dark gray/off-black */
            padding: 2.5rem;
            border-radius: 0.75rem; /* Slightly less rounded */
            box-shadow: 0 0 20px rgba(200, 162, 0, 0.2); /* Darker Gold glow */
            border: 1px solid #C8A200; /* Darker Gold border */
            width: 100%;
            max-width: 1024px; /* Increased max-width */
            margin-top: 2rem;
            position: relative;
            overflow: hidden; /* For potential future effects */
        }
        /* Subtle scanline effect - keeping black for subtle texture */
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0.1) 0px,
                rgba(0, 0, 0, 0.1) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 0;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 700;
            color: #C8A200; /* Darker Gold for labels */
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 0.75rem;
            background-color: #0a0a0a; /* Darker input background */
            border: 1px solid #CC7722; /* Darker Orange border */
            border-radius: 0.5rem;
            font-size: 1rem;
            color: #ffffff; /* White text */
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input[type="text"]:focus, input[type="number"]:focus {
            outline: none;
            border-color: #C8A200; /* Darker Gold on focus */
            box-shadow: 0 0 0 3px rgba(200, 162, 0, 0.4); /* Darker Gold glow on focus */
        }
        button {
            background-color: #CC7722; /* Darker Orange button */
            color: white;
            padding: 0.825rem 1.65rem; /* 10% larger padding */
            border-radius: 0.5rem;
            font-weight: 700;
            font-size: 1rem; /* Explicitly set font size to keep it constant */
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s, border-color 0.2s;
            border: 2px solid #ffffff; /* Solid white border */
            box-shadow: none; /* Removed default shadow */
            width: 100%;
            text-transform: uppercase; /* ZZZ style */
            letter-spacing: 0.05em;
        }
        button:hover {
            background-color: #B86B1E; /* Even darker orange */
            transform: translateY(-2px);
            border-color: #C8A200; /* Darker Gold border on hover */
            box-shadow: none; /* Ensure no shadow on hover */
        }
        button:active {
            transform: translateY(0);
            border-color: #ffffff; /* White border on active */
            box-shadow: none; /* Ensure no shadow on active */
        }
        .loading-spinner {
            border: 4px solid rgba(200, 162, 0, 0.2); /* Darker Gold spinner */
            border-left-color: #C8A200;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 2rem auto;
            display: none; /* Hidden by default */
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .results-section {
            margin-top: 2.5rem;
            border-top: 1px solid #C8A200; /* Darker Gold separator */
            padding-top: 2.5rem;
        }
        .post-card {
            background-color: #2a2a2a; /* Darker gray for contrast */
            padding: 1.5rem;
            border-radius: 0.75rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 0 10px rgba(200, 162, 0, 0.15); /* Subtle darker gold glow */
            border: 1px solid #CC7722; /* Darker Orange border */
        }
        .post-card h3 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #C8A200; /* Darker Gold for titles */
            margin-bottom: 0.75rem;
            text-shadow: 0 0 5px rgba(200, 162, 0, 0.5); /* Subtle glow effect */
        }
        .post-card p {
            color: #e0e0e0; /* Lighter gray for body text */
            line-height: 1.6;
            margin-bottom: 0.5rem;
        }
        .post-card strong {
            color: #ffffff; /* White for strong text */
        }
        .comment-summary-section {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px dashed #CC7722; /* Darker Orange dashed separator */
        }
        .comment-summary-section h4 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #C8A200; /* Darker Gold for sub-titles */
            margin-bottom: 0.75rem;
        }
        .comment-detail {
            background-color: #1a1a1a; /* Same as container for nested elements */
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-bottom: 0.5rem;
            border: 1px solid #C8A200; /* Darker Gold border */
        }
        .error-message {
            color: #FF3131; /* Bright red for errors */
            background-color: #330000; /* Dark red background */
            padding: 1rem;
            border-radius: 0.5rem;
            margin-top: 1rem;
            display: none;
            border: 1px solid #FF3131;
        }
        /* Custom colors for sentiment and links */
        .text-green-500 {
            color: #39FF14; /* Neon green */
        }
        .text-red-500 {
            color: #FF3131; /* Brighter red */
        }
        .text-gray-400 {
            color: #B0B0B0; /* Lighter gray */
        }
        .text-yellow-500 { /* For links - adjusted to darker yellow */
            color: #C8A200; /* Darker Gold for links */
        }
        .hover\:underline:hover {
            text-decoration: underline;
            text-decoration-color: #C8A200; /* Darker Gold underline */
        }

        /* Responsive adjustments */
        @media (min-width: 640px) {
            button {
                width: auto;
                padding-left: 2rem;
                padding-right: 2rem;
            }
            .input-grid {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-3xl font-bold text-center mb-8" style="color: #C8A200; text-shadow: 0 0 10px rgba(200, 162, 0, 0.7);">
            // REDDIT NEWS FEED //
        </h1>

        <div class="input-grid">
            <div class="input-group">
                <label for="subreddit">SUBREDDIT:</label>
                <input type="text" id="subreddit" value="news" placeholder="e.g., worldnews, technology">
            </div>
            <div class="input-group">
                <label for="postLimit">POST COUNT:</label>
                <input type="number" id="postLimit" value="5" min="1" max="20">
            </div>
            <div class="input-group">
                <label for="commentLimit">COMMENT LIMIT:</label>
                <input type="number" id="commentLimit" value="10" min="1" max="50">
            </div>
        </div>

        <button id="summarizeBtn">INITIATE SUMMARY PROTOCOL</button>

        <div id="loadingSpinner" class="loading-spinner"></div>
        <div id="errorMessage" class="error-message"></div>

        <div id="results" class="results-section hidden">
            <h2 class="text-2xl font-semibold mb-6" style="color: #C8A200; text-shadow: 0 0 8px rgba(200, 162, 0, 0.5);">
                // SUMMARIZED DATA LOGS //
            </h2>
            <!-- Summarized posts will be injected here -->
        </div>
    </div>

    <script>
        const summarizeBtn = document.getElementById('summarizeBtn');
        const subredditInput = document.getElementById('subreddit');
        const postLimitInput = document.getElementById('postLimit');
        const commentLimitInput = document.getElementById('commentLimit');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const errorMessage = document.getElementById('errorMessage');
        const resultsDiv = document.getElementById('results');

        summarizeBtn.addEventListener('click', async () => {
            const subreddit = subredditInput.value.trim();
            const postLimit = parseInt(postLimitInput.value, 10);
            const commentLimit = parseInt(commentLimitInput.value, 10);

            // Basic validation
            if (!subreddit) {
                showError('// ERROR: SUBREDDIT NAME REQUIRED //');
                return;
            }
            if (isNaN(postLimit) || postLimit < 1 || postLimit > 20) {
                showError('// ERROR: POST COUNT MUST BE 1-20 //');
                return;
            }
            if (isNaN(commentLimit) || commentLimit < 1 || commentLimit > 50) {
                showError('// ERROR: COMMENT LIMIT MUST BE 1-50 //');
                return;
            }

            // Clear previous results and errors
            resultsDiv.innerHTML = '<h2 class="text-2xl font-semibold mb-6" style="color: #C8A200; text-shadow: 0 0 8px rgba(200, 162, 0, 0.5);">// SUMMARIZED DATA LOGS //</h2>';
            resultsDiv.classList.add('hidden');
            hideError();
            showLoading();

            try {
                // --- IMPORTANT: Placeholder for your backend API call ---
                // In a real application, you would have a Python backend (e.g., Flask/FastAPI)
                // running that exposes an API endpoint.
                // Example: const response = await fetch('http://localhost:5000/summarize', {
                //     method: 'POST',
                //     headers: { 'Content-Type': 'application/json' },
                //     body: JSON.stringify({ subreddit, post_limit: postLimit, comment_limit: commentLimit })
                // });
                // const data = await response.json();
                // --- END Placeholder ---

                // For demonstration, we'll simulate data.
                // In a real app, 'data' would come from your Python backend.
                const simulatedData = await simulateBackendCall(subreddit, postLimit, commentLimit);

                if (simulatedData.length === 0) {
                    showError('// ALERT: NO DATA FOUND FOR CRITERIA //');
                    return;
                }

                displayResults(simulatedData);
                resultsDiv.classList.remove('hidden');

            } catch (error) {
                console.error('Error:', error);
                showError('// SYSTEM ERROR: ' + error.message.toUpperCase() + ' //');
            } finally {
                hideLoading();
            }
        });

        function showLoading() {
            loadingSpinner.style.display = 'block';
            summarizeBtn.disabled = true;
            summarizeBtn.classList.add('opacity-50', 'cursor-not-allowed');
            summarizeBtn.textContent = 'PROCESSING DATA...';
        }

        function hideLoading() {
            loadingSpinner.style.display = 'none';
            summarizeBtn.disabled = false;
            summarizeBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            summarizeBtn.textContent = 'INITIATE SUMMARY PROTOCOL';
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }

        function hideError() {
            errorMessage.style.display = 'none';
            errorMessage.textContent = '';
        }

        function displayResults(posts) {
            posts.forEach(post => {
                const postCard = document.createElement('div');
                postCard.className = 'post-card';
                postCard.innerHTML = `
                    <h3 class="text-yellow-400">${post.title}</h3>
                    <p><strong class="text-yellow-500">SUBREDDIT:</strong> r/${post.subreddit}</p>
                    <p><strong class="text-yellow-500">SCORE:</strong> ${post.score}</p>
                    <p><strong class="text-yellow-500">COMMENTS:</strong> ${post.num_comments}</p>
                    <p class="mt-4"><strong class="text-yellow-400">POST SUMMARY:</strong> ${post.post_summary || '// NO SUMMARY AVAILABLE //'}</p>
                    <a href="${post.url}" target="_blank" rel="noopener noreferrer" class="text-yellow-500 hover:underline mt-2 inline-block">ACCESS ORIGINAL LOG</a>

                    <div class="comment-summary-section">
                        <h4>// COMMENT ANALYSIS //</h4>
                        <p><strong class="text-yellow-400">OVERALL COMMENT SUMMARY:</strong> ${post.comments_summary || '// NO COMMENT SUMMARY AVAILABLE //'}</p>
                        <p><strong class="text-yellow-500">AGREEMENT:</strong> <span class="text-green-500">${post.comment_agreement_percentage}%</span></p>
                        <p><strong class="text-yellow-500">DISAGREEMENT:</strong> <span class="text-red-500">${post.comment_disagreement_percentage}%</span></p>
                        <p><strong class="text-yellow-500">NEUTRAL:</strong> <span class="text-gray-400">${post.comment_neutral_percentage}%</span></p>
                        <h5 class="font-semibold mt-4 mb-2" style="color: #C8A200;">// TOP COMMENT LOGS //</h5>
                        <div class="comment-details-list">
                            ${post.comment_details.map(comment => `
                                <div class="comment-detail">
                                    <p><strong class="text-yellow-500">AUTHOR:</strong> ${comment.author}</p>
                                    <p><strong class="text-yellow-500">SCORE:</strong> ${comment.score}</p>
                                    <p><strong class="text-yellow-500">SENTIMENT:</strong> <span class="${comment.sentiment_label === 'POSITIVE' ? 'text-green-500' : comment.sentiment_label === 'NEGATIVE' ? 'text-red-500' : 'text-gray-400'}">${comment.sentiment_label} (${(comment.sentiment_score * 100).toFixed(2)}%)</span></p>
                                    <p class="mt-2"><strong class="text-yellow-400">SUMMARY:</strong> ${comment.summary || '// N/A //'}</p>
                                    <p class="text-sm text-gray-500 italic mt-1">// ORIGINAL SNIPPET: "${comment.original_text_snippet}"</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                resultsDiv.appendChild(postCard);
            });
        }

        // --- Simulated Backend Call (REPLACE WITH REAL FETCH TO YOUR PYTHON API) ---
        // This function simulates the data structure your Python backend would return.
        async function simulateBackendCall(subreddit, postLimit, commentLimit) {
            console.log(`// SIMULATING BACKEND CALL: SUBREDDIT ${subreddit}, POSTS ${postLimit}, COMMENTS ${commentLimit} //`);
            // In a real scenario, this would be your actual fetch call to your Flask/FastAPI backend.
            // Example:
            // const response = await fetch('http://localhost:5000/summarize', {
            //     method: 'POST',
            //     headers: { 'Content-Type': 'application/json' },
            //     body: JSON.stringify({ subreddit, post_limit: postLimit, comment_limit: commentLimit })
            // });
            // if (!response.ok) {
            //     const errorText = await response.text();
            //     throw new Error(`HTTP error! status: ${response.status}, message: ${errorText}`);
            // }
            // return await response.json();

            // For now, returning dummy data to show UI functionality
            await new Promise(resolve => setTimeout(resolve, 2000)); // Simulate network delay
            return [
                {
                    post_id: "example1",
                    title: "CRITICAL ALERT: QUANTUM ENTANGLEMENT STABILIZED IN LAB",
                    author: "AGENT_ZERO",
                    subreddit: subreddit,
                    score: 12345,
                    num_comments: 567,
                    url: "https://www.reddit.com/r/news/comments/example1/",
                    post_summary: "BREAKTHROUGH IN QUANTUM PHYSICS: RESEARCHERS ANNOUNCE SUCCESSFUL STABILIZATION OF ENTANGLED PARTICLES, OPENING NEW AVENUES FOR SECURE COMMUNICATION AND COMPUTING. IMPLICATIONS FOR REALITY FABRIC UNKNOWN.",
                    comments_summary: "// DATA LOG: 6 POSITIVE, 3 NEGATIVE, 1 NEUTRAL. KEY THEMES: EXCITEMENT FOR NEW TECH, FEAR OF UNSTABLE REALITY, CALLS FOR ETHICAL OVERSIGHT. //",
                    comment_agreement_percentage: 60.0,
                    comment_disagreement_percentage: 30.0,
                    comment_neutral_percentage: 10.0,
                    comment_details: [
                        { id: "c1", author: "CYBER_NOMAD", score: 150, sentiment_label: "POSITIVE", sentiment_score: 0.98, summary: "THIS IS THE FUTURE. IMMINENT DATA TRANSFER SPEEDS. //", original_text_snippet: "THIS IS THE FUTURE. IMMINENT DATA TRANSFER SPEEDS. OUR DIGITAL LIVES WILL BE TRANSFORMED." },
                        { id: "c2", author: "VOID_WALKER", score: 80, sentiment_label: "NEGATIVE", sentiment_score: 0.92, summary: "DANGEROUS. INTERFERING WITH REALITY HAS CONSEQUENCES. //", original_text_snippet: "DANGEROUS. INTERFERING WITH THE FABRIC OF REALITY ALWAYS HAS UNFORESEEN CONSEQUENCES. BEWARE." },
                        { id: "c3", author: "TECH_MAGE", score: 50, sentiment_label: "POSITIVE", sentiment_score: 0.85, summary: "POTENTIAL FOR UNLIMITED COMPUTATIONAL POWER. //", original_text_snippet: "THE POTENTIAL FOR UNLIMITED COMPUTATIONAL POWER IS NOW WITHIN REACH. A NEW ERA BEGINS." },
                        { id: "c4", author: "DATA_DRONE", score: 20, sentiment_label: "NEUTRAL", sentiment_score: 0.55, summary: "OBSERVING DATA. IMPLICATIONS UNCERTAIN. //", original_text_snippet: "OBSERVING DATA. IMPLICATIONS REMAIN UNCERTAIN. FURTHER ANALYSIS REQUIRED BEFORE JUDGMENT." },
                    ]
                },
                {
                    post_id: "example2",
                    title: "URBAN INFRASTRUCTURE UPGRADE INITIATED: NEON DISTRICTS",
                    author: "CITY_PLANNER",
                    subreddit: subreddit,
                    score: 8765,
                    num_comments: 321,
                    url: "https://www.reddit.com/r/news/comments/example2/",
                    post_summary: "MAJOR CITY-WIDE UPGRADE PROJECT LAUNCHED TO MODERNIZE INFRASTRUCTURE AND ENHANCE NEON DISTRICTS. AIMING FOR INCREASED EFFICIENCY AND VISUAL APPEAL. CITIZEN FEEDBACK ENCOURAGED.",
                    comments_summary: "// DATA LOG: 7 POSITIVE, 2 NEGATIVE, 1 NEUTRAL. KEY THEMES: OPTIMISM FOR CITY REVITALIZATION, CONCERNS ABOUT GENTRIFICATION, CALLS FOR TRANSPARENCY. //",
                    comment_agreement_percentage: 70.0,
                    comment_disagreement_percentage: 20.0,
                    comment_neutral_percentage: 10.0,
                    comment_details: [
                        { id: "c5", author: "BRIGHT_LIGHTS", score: 120, sentiment_label: "POSITIVE", sentiment_score: 0.95, summary: "FINALLY, THE CITY WILL SHINE BRIGHTER! //", original_text_snippet: "FINALLY, THE CITY WILL SHINE BRIGHTER! CAN'T WAIT TO SEE THE NEW NEON DISTRICTS." },
                        { id: "c6", author: "OLD_SCHOOL", score: 40, sentiment_label: "NEGATIVE", sentiment_score: 0.88, summary: "JUST MORE GENTRIFICATION. DISPLACING THE LOCALS. //", original_text_snippet: "THIS IS JUST MORE GENTRIFICATION. THEY'RE DISPLACING THE LOCALS FOR CORPORATE INTERESTS." },
                        { id: "c7", author: "FUTURE_FAN", score: 60, sentiment_label: "POSITIVE", sentiment_score: 0.90, summary: "A NECESSARY STEP FOR PROGRESS. //", original_text_snippet: "A NECESSARY STEP FOR PROGRESS. THE CITY NEEDS TO EVOLVE TO STAY RELEVANT." },
                    ]
                }
            ];
        }
    </script>
</body>
</html>
