<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reddit News Summarizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* ... (No changes to the style section) ... */
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">Reddit News Summarizer UI</h1>

        <div class="input-grid">
            <div class="input-group">
                <label for="subreddit">Subreddit:</label>
                <input type="text" id="subreddit" value="news" placeholder="e.g., worldnews, technology" class="rounded-lg">
            </div>
            <div class="input-group">
                <label for="postLimit">Number of Posts:</label>
                <input type="number" id="postLimit" value="5" min="1" max="20" class="rounded-lg">
            </div>
            <div class="input-group">
                <label for="commentLimit">Comments per Post:</label>
                <input type="number" id="commentLimit" value="10" min="1" max="50" class="rounded-lg">
            </div>
        </div>

        <button id="summarizeBtn" class="rounded-lg">Summarize Reddit News</button>

        <div id="loadingSpinner" class="loading-spinner"></div>
        <div id="errorMessage" class="error-message"></div>

        <div id="results" class="results-section hidden">
            <h2 class="text-2xl font-semibold text-gray-700 mb-6">Summarized Posts</h2>
        </div>
    </div>

    <script>
        const summarizeBtn = document.getElementById('summarizeBtn');
        const subredditInput = document.getElementById('subreddit');
        const postLimitInput = document.getElementById('postLimit');
        const commentLimitInput = document.getElementById('commentLimit');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const errorMessage = document.getElementById('errorMessage');
        const resultsDiv = document.getElementById('results');

        summarizeBtn.addEventListener('click', async () => {
            const subreddit = subredditInput.value.trim();
            const postLimit = parseInt(postLimitInput.value, 10);
            const commentLimit = parseInt(commentLimitInput.value, 10);

            if (!subreddit) {
                showError('Please enter a subreddit name.');
                return;
            }
            if (isNaN(postLimit) || postLimit < 1 || postLimit > 20) {
                showError('Number of posts must be between 1 and 20.');
                return;
            }
            if (isNaN(commentLimit) || commentLimit < 1 || commentLimit > 50) {
                showError('Comments per post must be between 1 and 50.');
                return;
            }

            resultsDiv.innerHTML = '<h2 class="text-2xl font-semibold text-gray-700 mb-6">Summarized Posts</h2>';
            resultsDiv.classList.add('hidden');
            hideError();
            showLoading();

            try {
                // --- REAL BACKEND API CALL ---
                const response = await fetch('http://localhost:5000/summarize', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ subreddit, post_limit: postLimit, comment_limit: commentLimit })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || `HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                const processedPosts = data.data; // Access the 'data' key

                if (processedPosts.length === 0) {
                    showError('No posts found or summarized for the given criteria.');
                    return;
                }

                displayResults(processedPosts);
                resultsDiv.classList.remove('hidden');

            } catch (error) {
                console.error('Error:', error);
                showError('An error occurred while summarizing: ' + error.message);
            } finally {
                hideLoading();
            }
        });

        function showLoading() {
            loadingSpinner.style.display = 'block';
            summarizeBtn.disabled = true;
            summarizeBtn.classList.add('opacity-50', 'cursor-not-allowed');
        }

        function hideLoading() {
            loadingSpinner.style.display = 'none';
            summarizeBtn.disabled = false;
            summarizeBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }

        function hideError() {
            errorMessage.style.display = 'none';
            errorMessage.textContent = '';
        }

        function displayResults(posts) {
            posts.forEach(post => {
                const postCard = document.createElement('div');
                postCard.className = 'post-card';
                // Convert UTC date to a more readable local format
                const createdDate = post.created_utc ? new Date(post.created_utc).toLocaleString() : 'N/A';

                postCard.innerHTML = `
                    <h3 class="text-indigo-700">${post.title}</h3>
                    <p><strong>Subreddit:</strong> r/${post.subreddit}</p>
                    <p><strong>Score:</strong> ${post.score}</p>
                    <p><strong>Comments:</strong> ${post.num_comments}</p>
                    <p><strong>Created:</strong> ${createdDate}</p>
                    <p><strong>Post Summary:</strong> ${post.post_summary || 'No summary available.'}</p>
                    <a href="${post.url}" target="_blank" rel="noopener noreferrer" class="text-blue-600 hover:underline">Read Original Post</a>

                    <div class="comment-summary-section">
                        <h4>Comment Analysis:</h4>
                        <p><strong>Overall Comment Summary:</strong> ${post.comments_summary || 'No comment summary available.'}</p>
                        <p><strong>Agreement:</strong> <span class="text-green-600">${post.comment_agreement_percentage}%</span></p>
                        <p><strong>Disagreement:</strong> <span class="text-red-600">${post.comment_disagreement_percentage}%</span></p>
                        <p><strong>Neutral:</strong> <span class="text-gray-600">${post.comment_neutral_percentage}%</span></p>
                        <h5 class="font-semibold mt-4 mb-2">Top Comment Details:</h5>
                        <div class="comment-details-list">
                            ${post.comment_details.map(comment => `
                                <div class="comment-detail">
                                    <p><strong>Author:</strong> ${comment.author}</p>
                                    <p><strong>Score:</strong> ${comment.score}</p>
                                    <p><strong>Sentiment:</strong> <span class="${comment.sentiment_label === 'POSITIVE' ? 'text-green-600' : comment.sentiment_label === 'NEGATIVE' ? 'text-red-600' : 'text-gray-600'}">${comment.sentiment_label} (${(comment.sentiment_score * 100).toFixed(2)}%)</span></p>
                                    <p><strong>Summary:</strong> ${comment.summary || 'N/A'}</p>
                                    <p class="text-sm text-gray-500 italic">Original snippet: "${comment.original_text_snippet}"</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                resultsDiv.appendChild(postCard);
            });
        }
    </script>
</body>
</html>
